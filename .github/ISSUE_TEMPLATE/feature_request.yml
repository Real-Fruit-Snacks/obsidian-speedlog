name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not just the feature. "I keep losing X because Y" is more useful than "add a button for Z".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
      description: Optional. Sketch the behaviour you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other plugins, workarounds, or settings that get close.
